<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rejoindre Vertex</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

<main>

<section class="hero">

<h1>REJOINDRE VERTEX</h1>


<form 
    name="candidature"
    method="POST"
    data-netlify="true"
>


<input type="hidden" name="form-name" value="candidature">


<label>
Pseudo
</label>

<input 
    type="text"
    name="pseudo"
    required
>


<label>
Âge
</label>

<input 
    type="number"
    name="age"
    required
>


<label>
Compétences
</label>

<textarea
    name="competences"
    placeholder="Ex : Python, cybersécurité, Blender, électronique..."
></textarea>


<label>
Motivation
</label>

<textarea
    name="motivation"
    placeholder="Pourquoi souhaitez-vous rejoindre Vertex ?"
    required
></textarea>


<label>
Discord
</label>

<input
    type="text"
    name="discord"
>


<button type="submit">
Envoyer la candidature
</button>


</form>


</section>

</main>


<footer>
© 2026 Vertex
</footer>


</body>

</html>
