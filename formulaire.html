<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rejoindre Vertex</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

<main>

<section class="hero">

<h1>REJOINDRE VERTEX</h1>


<form action="https://formspree.io/f/xgawwlay" method="POST">


<label>
Pseudo
</label>

<input 
type="text" 
name="pseudo"
required>


<label>
Âge
</label>

<input 
type="number" 
name="age"
required>


<label>
Adresse mail
</label>

<input 
type="email"
name="email"
required>


<label>
Domaine d'intérêt
</label>

<select name="domaine">

<option>Développement</option>
<option>Cybersécurité</option>
<option>Jeux vidéo</option>
<option>Électronique</option>
<option>Autre</option>

</select>


<label>
Compétences
</label>

<textarea
name="competences"
placeholder="Ex : Python, C++, Blender, Arduino..."
></textarea>


<label>
Motivation
</label>

<textarea
name="motivation"
placeholder="Pourquoi souhaitez-vous rejoindre Vertex ?"
required></textarea>


<button type="submit">
Envoyer ma candidature
</button>


</form>


</section>

</main>


<footer>
© 2026 Vertex
</footer>


</body>

</html>
